[package]
name = "irs-tools"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.9.5", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
tauri = "2.9.5"

[features]
custom-protocol = ["tauri/custom-protocol"]
