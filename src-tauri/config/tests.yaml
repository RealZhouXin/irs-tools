stages:
  - info
  - software
  - status
  - battery
  - sensor
  - cutting_height
  - actuator
  - key_test
  - motor

tests:
  - name: "526 应用板硬件信息"
    command: param_id526
    stage: info
    checks:
      - name: pcb_pn
        output: pcb_pn
        min: 40085400
        max: 40085400
      - name: pcb_rev
        output: pcb_rev
        min: 4
        max: 9

  - name: "588 应用软件"
    command: param_id588
    stage: software
    checks:
      - name: software_version
        min: "1.2.3"
        max: "9.9.9"

  - name: "654 系统软件版本"
    command: param_id654
    stage: software
    checks:
      - name: software_version
        min: "0.1.4"
        max: "9.9.9"

  - name: "794 HMI板软件版本"
    command: param_id794
    stage: software
    checks:
      - name: software_version
        min: "1.2.3"
        max: "9.9.9"

  - name: "068 主板应用软件"
    command: param_id068
    stage: software
    checks:
      - name: software_version
        min: "1.2.3"
        max: "9.9.9"

  - name: "798 通信板软件版本"
    command: param_id798
    stage: software

  - name: "096 无线通信状态"
    command: param_id096
    stage: status
    checks:
      - name: sim_status
        output: sim_status
        min: 1
        max: 1
      - name: gprs_lte_sign_qual
        output: gprs_lte_sign_qual
        min: 51
        max: 255
      - name: gnss_hw_stat
        output: gnss_hw_stat
        min: 3
        max: 3

  - name: "796 MQTT在线状态"
    command: param_id796
    stage: status
    checks:
      - name: mqtt_status
        output: mqtt_status
        min: 1
        max: 1

  - name: "120 加速度计数据"
    command: param_id120
    stage: sensor
    checks:
      - name: accel_x
        output: accel_x
        min: -0.3
        max: 0.3
      - name: accel_y
        output: accel_y
        min: -0.3
        max: 0.3
      - name: accel_z
        output: accel_z
        min: 9.6
        max: 10.0

  - name: "122 温度数据"
    command: param_id122
    stage: sensor
    checks:
      - name: bat_temp
        output: bat_temp
        min: 0
        max: 40
      - name: app_board_temp
        output: app_board_temp
        min: -100
        max: 600

  - name: "118 碰撞条测试"
    command: param_id118_collision_bar
    stage: sensor
    timeout_ms: 30000

  - name: "118 抬升传感器测试"
    command: param_id118_lift_sensor
    stage: sensor
    timeout_ms: 30000
    lift_threshold: 0

  - name: "刀盘低位校验（30mm）"
    command: cutting_height_set_and_verify
    stage: cutting_height
    cutting_height_mm: 30
    wait_ms: 2000
    checks:
      - name: cutting_height_mm
        output: cutting_height_mm
        min: 28
        max: 32

  - name: "刀盘中位校验（60mm）"
    command: cutting_height_set_and_verify
    stage: cutting_height
    cutting_height_mm: 60
    wait_ms: 2000
    checks:
      - name: cutting_height_mm
        output: cutting_height_mm
        min: 58
        max: 62

  - name: "刀盘高位校验（90mm）"
    command: cutting_height_set_and_verify
    stage: cutting_height
    cutting_height_mm: 90
    wait_ms: 2000
    checks:
      - name: cutting_height_mm
        output: cutting_height_mm
        min: 88
        max: 92

  - name: "606 前灯设置"
    command: param_id606
    stage: actuator
    front_light_mode: 1
    power: 80

  - name: "568 扬声器测试"
    command: param_id568
    stage: actuator

  - name: "610 尾灯三色确认"
    command: param_id610
    stage: actuator

  - name: "080 急停键测试"
    command: param_id080_emergency_stop
    stage: key_test
    # 超时时间（毫秒）
    timeout_ms: 30000

  - name: "776 按键测试"
    command: param_id776
    stage: key_test
    # 超时时间（毫秒），用户需在此时间内按下所有按键
    timeout_ms: 30000

  - name: "驱动轮电机测试"
    command: wheel_motor_test
    stage: motor
    # 电机驱动速度（可配）
    right_motor_speed: 45
    left_motor_speed: 45
    # 采样配置（可配）
    sample_interval_ms: 1000
    sample_count: 5
    # 被动轮（另一侧）最大允许转速（可配，默认 10）
    right_test_inactive_max_speed_mm_s: 10
    left_test_inactive_max_speed_mm_s: 10
    checks:
      - name: right_wheel_motor
        output: right_wheel_motor
        min: 400
        max: 999999
      - name: left_wheel_motor
        output: left_wheel_motor
        min: 400
        max: 999999
