name: Release MSI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    environment: 
      name: irs tools release # ✅ 明确指定 name 属性
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Validate tag matches Cargo version
        run: |
          $manifest = Get-Content -Raw src-tauri/Cargo.toml
          if ($manifest -notmatch '(?m)^version\s*=\s*"([^"]+)"') {
            throw "Failed to read version from src-tauri/Cargo.toml"
          }

          $cargoVersion = $Matches[1]
          $expectedTag = "v$cargoVersion"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Git tag '$env:GITHUB_REF_NAME' does not match Cargo version '$expectedTag'"
          }

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build and publish MSI bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "irs-tools v__VERSION__"
          generateReleaseNotes: true
          tauriScript: bun run tauri
          args: --bundles msi
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
